[package]
name = "kgateway-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kgateway-core = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
# AWS SigV4 (Bedrock connector)
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
# Sarvam returns synthesized audio as base64 inside a JSON envelope rather than
# as a raw body, so the connector has to decode it. Vertex also needs it for the
# base64url segments of its service-account JWT.
base64 = { workspace = true }
# Vertex service-account auth: RS256 over the JWT assertion.
ring = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
